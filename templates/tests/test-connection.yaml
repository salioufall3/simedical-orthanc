apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "simedical-orthanc.fullname" . }}-test-connection"
  labels:
    {{- include "simedical-orthanc.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    # /system exige l'auth → on vérifie juste que le port HTTP d'Orthanc répond (TCP).
    - name: nc
      image: busybox
      command: ['nc']
      args: ['-z', '-v', '{{ include "simedical-orthanc.fullname" . }}', '{{ .Values.service.http.port }}']
  restartPolicy: Never
