{{- $es := .Values.externalSecret | default dict -}}
{{- if $es.enabled -}}
{{- $fullname := include "simedical-orthanc.fullname" . -}}
# ExternalSecret — tire les secrets Orthanc depuis Vault (KV v2, une clé PAR
# variable) et les matérialise dans un Secret k8s `<fullname>-env`, injecté par
# envFrom dans le pod. L'image orthancteam/orthanc lit toute variable ORTHANC__<CLE>
# comme une option de config. Clés attendues au coffre :
#   ORTHANC__REGISTERED_USERS            = {"simedical":"<password>"}
#   ORTHANC__AWS_S3_STORAGE__ACCESS_KEY  = <minio-access-key>
#   ORTHANC__AWS_S3_STORAGE__SECRET_KEY  = <minio-secret-key>
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ $fullname }}-env
  labels:
    {{- include "simedical-orthanc.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $es.refreshInterval | default "1h" }}
  secretStoreRef:
    kind: {{ $es.storeKind | default "SecretStore" }}
    name: {{ $es.storeName | default "vault-secret-store" }}
  target:
    name: {{ $fullname }}-env
    creationPolicy: Owner
  # extract = TOUTES les clés du secret Vault deviennent des clés du Secret k8s.
  dataFrom:
    - extract:
        key: {{ $es.path | default (printf "apps/si-medical-v2/pacs/%s/orthanc/env" .Release.Namespace) }}
{{- end }}
