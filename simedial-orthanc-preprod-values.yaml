# Default values for simedical-orthanc.
# PACS DICOM (Orthanc) — profil `pacs` du docker-compose porté sur Kubernetes (specs/31).
# Orthanc est ENCAPSULÉ derrière ImagingPort : le front n'y accède JAMAIS en direct (proxy BFF).

replicaCount: 1

image:
  repository: orthancteam/orthanc
  pullPolicy: IfNotPresent
  # Laisse vide pour utiliser l'appVersion du Chart (24.10.1).
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# ─────────────────────────────────────────────────────────────────────────────
# Réseau — deux ports (comme le compose) :
#   http  8042 : DICOMweb (QIDO/WADO/STOW) + API REST + UI — proxifié en aval (BFF)
#   dicom 4242 : DIMSE (C-ECHO / C-STORE / C-FIND MWL)
# ClusterIP par défaut : joignable uniquement in-cluster (BFF proxy / pacs-mpps).
# Pour laisser une modalité physique faire du C-STORE direct : passer service.type
# à LoadBalancer/NodePort (le port `dicom` sera alors exposé).
# ─────────────────────────────────────────────────────────────────────────────
service:
  type: ClusterIP
  http:
    port: 8042
  dicom:
    port: 4242

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# ─────────────────────────────────────────────────────────────────────────────
# ExternalSecret / Vault — même convention que si-medical-chart (une clé par
# variable, matérialisée dans un Secret k8s `<fullname>-env`, injecté via envFrom).
# L'image orthancteam/orthanc lit toute variable ORTHANC__<CLE> comme une option de
# config (JSON), `__` séparant les niveaux imbriqués. Clés à pousser au coffre :
#   ORTHANC__REGISTERED_USERS            = {"simedical":"<password>"}
#   ORTHANC__AWS_S3_STORAGE__ACCESS_KEY  = <minio-access-key>
#   ORTHANC__AWS_S3_STORAGE__SECRET_KEY  = <minio-secret-key>
# Ces valeurs SURCHARGENT/complètent la config du ConfigMap → aucun secret en clair
# dans le ConfigMap. Rotation = redémarrer le pod (ESO rafraîchit, Orthanc lit au boot).
# ─────────────────────────────────────────────────────────────────────────────
externalSecret:
  enabled: true
  refreshInterval: 1h
  storeKind: SecretStore
  storeName: vault-secret-store
  # Chemin Vault KV v2 (défaut si vide : apps/si-medical-v2/pacs/<release-namespace>/orthanc/env)
  path: "apps/si-medical-v2/preprod/pacs/orthanc/env"
  # Secret commun optionnel (envFrom d'abord → le per-app prime).
  commonSecretName: ""

# ─────────────────────────────────────────────────────────────────────────────
# Stockage — l'INDEX (métadonnées, SQLite) est LOCAL sur PVC ; les PIXELS DICOM
# vont sur MinIO/S3 (plugin object-storage, config AwsS3Storage ci-dessous).
# ─────────────────────────────────────────────────────────────────────────────
persistence:
  enabled: true
  accessModes:
    - ReadWriteOnce
  size: 8Gi
  storageClassName: ""
  # Réutiliser un PVC existant plutôt que d'en créer un :
  existingClaim: ""
  # Dossier des worklists (.wl) servi par C-FIND MWL. En prod il est ÉCRIT par le
  # worker MWL de v2 (hors de ce chart) → volume partagé RWX. Par défaut emptyDir
  # (le PACS sert, personne n'écrit) ; fournir un existingClaim RWX pour le MWL.
  worklists:
    existingClaim: ""

# ─────────────────────────────────────────────────────────────────────────────
# Configuration Orthanc — rendue telle quelle dans /etc/orthanc/orthanc.json
# (ConfigMap). NE PAS y mettre de secret : RegisteredUsers + credentials S3
# arrivent par l'ExternalSecret ci-dessus (variables ORTHANC__...).
# ─────────────────────────────────────────────────────────────────────────────
orthanc:
  config:
    Name: SIMEDICAL-PACS
    DicomAet: SIMEDICAL
    DicomPort: 4242
    HttpPort: 8042

    RemoteAccessAllowed: true
    AuthenticationEnabled: true
    # RegisteredUsers → ExternalSecret (ORTHANC__REGISTERED_USERS)

    # DICOMweb : STOW-RS/QIDO-RS/WADO-RS sous /dicom-web/ — consommé UNIQUEMENT via le proxy BFF.
    DicomWeb:
      Enable: true
      Root: /dicom-web/
      EnableWado: true
      WadoRoot: /wado

    # Plugin MWL : sert les .wl du dossier ci-dessous → la modalité les récupère par C-FIND.
    Worklists:
      Enable: true
      Database: /var/lib/orthanc/worklists

    # Modalités DICOM connues. SIM = modalité virtuelle du harnais de simulation.
    DicomModalities:
      SIM: [SIMULATOR, pacs-sim, 11112]

    # Ingestion : le cloisonnement tenant est REFAIT par le proxy BFF (specs/31 §3.5).
    DicomAlwaysAllowEcho: true
    DicomAlwaysAllowStore: true
    DicomCheckModalityHost: false
    UnknownSopClassAccepted: true

    # Étude 'stable' N s après la dernière instance. Dev: 2. Prod: remonter (ex. 60)
    # pour absorber les envois lents des modalités.
    StableAge: 2

    # Index (métadonnées) local ; pixels sur MinIO/S3 (voir `s3` ci-dessous).
    IndexDirectory: /var/lib/orthanc/db
    # NB : AwsS3Storage n'est PAS ici — il est piloté INTÉGRALEMENT par variables
    # d'env (bloc `s3` + credentials du coffre) pour éviter le piège de fusion :
    # l'image orthancteam remplace un objet entier plutôt que de fusionner ses
    # feuilles. En passant TOUT AwsS3Storage par l'env, l'objet reste complet.

  # AwsS3Storage — feuilles NON secrètes, injectées en variables d'env
  # (ORTHANC__AWS_S3_STORAGE__*). Les credentials (ACCESS_KEY/SECRET_KEY) viennent
  # du coffre via l'ExternalSecret et se combinent au même objet AwsS3Storage.
  # Les valeurs sont interprétées en JSON par Orthanc ("false"→bool, "30"→nombre).
  # Bucket `pacs-dicom` à pré-créer sur MinIO.
  s3:
    ORTHANC__AWS_S3_STORAGE__BUCKET_NAME: pacs-dicom
    ORTHANC__AWS_S3_STORAGE__REGION: us-east-1
    # Endpoint MinIO IN-CLUSTER (à adapter au service MinIO du namespace).
    ORTHANC__AWS_S3_STORAGE__ENDPOINT: http://minio.minio:9000
    ORTHANC__AWS_S3_STORAGE__VIRTUAL_ADDRESSING: "false"
    ORTHANC__AWS_S3_STORAGE__CONNECTION_TIMEOUT: "30"
    ORTHANC__AWS_S3_STORAGE__REQUEST_TIMEOUT: "1200"
    ORTHANC__AWS_S3_STORAGE__STORAGE_STRUCTURE: flat

# Variables d'environnement supplémentaires (ex. autres options ORTHANC__... ou VERBOSE_ENABLED).
extraEnv: []
  # - name: VERBOSE_ENABLED
  #   value: "true"

resources: {}
  # limits:
  #   cpu: 500m
  #   memory: 512Mi
  # requests:
  #   cpu: 100m
  #   memory: 256Mi

# /system exige l'auth (401) → on sonde le port en TCP plutôt qu'en HTTP.
livenessProbe:
  tcpSocket:
    port: http
  initialDelaySeconds: 20
  periodSeconds: 15
readinessProbe:
  tcpSocket:
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10

# Additional volumes on the output Deployment definition.
volumes: []

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []

nodeSelector: {}

tolerations: []

affinity: {}
